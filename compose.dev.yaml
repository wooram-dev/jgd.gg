name: jgd-gg-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${JGD_POSTGRES_PASSWORD:?Set JGD_POSTGRES_PASSWORD in .env}
      JGD_DATABASE_PASSWORD: ${JGD_DATABASE_PASSWORD:?Set JGD_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-dev-db.sh:/docker-entrypoint-initdb.d/init-dev-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
